<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="PAMC Comercial">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#10315a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <circle cx="1040" cy="70" r="150" fill="#38bdf8" fill-opacity="0.10"/>
  <circle cx="1130" cy="250" r="110" fill="#34d399" fill-opacity="0.10"/>
  <polyline points="760,215 830,175 890,195 960,125 1030,150 1110,85" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#34d399">
    <circle cx="830" cy="175" r="7"/><circle cx="960" cy="125" r="7"/><circle cx="1110" cy="85" r="7"/>
  </g>
  <text x="70" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff">PAMC Comercial</text>
  <rect x="72" y="150" width="150" height="6" rx="3" fill="url(#accent)"/>
  <text x="70" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#e2e8f0">Dados, automação e tecnologia a serviço do comercial</text>
  <text x="70" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">Construído pela equipe, revisado em Pull Request</text>
</svg>
